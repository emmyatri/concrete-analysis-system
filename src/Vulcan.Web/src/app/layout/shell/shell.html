<div class="shell">
  <header class="shell-header">
    <div class="shell-brand">
      <img src="assets/vulcan-logo.svg" alt="Vulcan Materials Company" class="shell-logo" />
    </div>

    <div class="shell-header-main">
      <p class="shell-title">
        <span class="shell-title-name">CBAS</span>
        <span class="shell-title-full">Concrete Batch Analysis System</span>
      </p>

      <div class="shell-header-actions">
        <p-tag [severity]="apiDisplay().severity" [rounded]="true" styleClass="api-status" data-testid="api-status">
          <span class="status-dot" aria-hidden="true"></span>
          {{ apiDisplay().label }}
        </p-tag>

        <div class="synthetic-toggle">
          <p-toggleswitch [(ngModel)]="showSynthetic" inputId="synthetic-toggle" />
          <label for="synthetic-toggle">Synthetic data</label>
        </div>

        <button
          type="button"
          class="technician-chip"
          data-testid="technician"
          aria-haspopup="menu"
          [attr.aria-label]="'Technician: ' + technicianName()"
          (click)="technicianMenuRef.toggle($event)"
        >
          <p-avatar [label]="technicianInitials()" shape="circle" styleClass="technician-avatar" />
          <span class="technician-name">{{ technicianName() }}</span>
          <i class="pi pi-chevron-down" aria-hidden="true"></i>
        </button>
        <p-menu #technicianMenuRef [model]="technicianMenu" [popup]="true" appendTo="body" />
      </div>
    </div>
  </header>

  <nav class="shell-sidebar" aria-label="Main menu">
    <p class="shell-section-label">Workspace</p>

    <ul class="shell-menu">
      @for (item of menu; track item.route) {
        <li>
          <a
            class="shell-menu-link"
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
          >
            <i [class]="item.icon" aria-hidden="true"></i>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>

    <p class="shell-version">{{ appInfo.name }} · v{{ appInfo.version }} · {{ appInfo.milestone }}</p>
  </nav>

  <main class="shell-content">
    <router-outlet />
  </main>
</div>
